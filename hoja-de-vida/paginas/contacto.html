<body>

  <div class="pagina">

    <header>
      <div class="contenedor">
        <h1>Mi Hoja de Vida</h1>
        <nav>
          <ul>
            <li><a href="../index.html" data-pagina="inicio">Inicio</a></li>
            <li><a href="formacion.html" data-pagina="formacion">Formación</a></li>

          </ul>
        </nav>
      </div>
    </header>

    <main class="contenedor">
      <h2>Contacto</h2>

      <section class="tarjeta">
        <p><strong>Correo electrónico:</strong> ogaviriac@unicartagena.edu.co</p>
        <p><strong>Teléfono:</strong> +57   3053641179</p>
        <p><strong>Ciudad:</strong> Turbaco, Bolívar, Colombia</p>
      </section>

      <section class="tarjeta">
        <h3>Formulario de contacto</h3>
        <form id="form-contacto" novalidate>
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

          <label for="correo">Correo:</label>
          <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>

          <label for="mensaje">Mensaje:</label>
          <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje..." required></textarea>

          <button type="submit">Enviar</button>

          <p id="mensaje-estado" class="mensaje-estado" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mi Hoja de Vida - Actividad Unidad 1</p>
    </footer>
